name: cube-hrms

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cube_hrms}
      APP_DB_USER: ${APP_DB_USER:-cube_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cube} -d ${POSTGRES_DB:-cube_hrms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage is a Wave 2 dependency; start it with:
  #   docker compose --profile storage up -d minio
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cube}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-cube_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-cube_hrms}
      # Schema migrations run as the DB owner; the API keeps using the
      # least-privilege app role so Postgres row-level security is enforced.
      # NOTE: credentials are interpolated into a URL — keep POSTGRES_PASSWORD
      # URL-safe (letters, digits, _ - only) or percent-encode it.
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cube}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cube_hrms}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: '["http://localhost:8081","http://127.0.0.1:8081"]'
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-cube_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-cube_hrms}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
