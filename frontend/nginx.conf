# Frontend nginx configuration for dual-port architecture
# Serves company portal at / and super admin at /super-admin

server {
    listen 80;
    server_name localhost;
    port_in_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Company Portal (port 5173 equivalent) - served at root
    location / {
        root /usr/share/nginx/html/company;
        try_files $uri $uri/ /index.html;
    }

    # Super Admin Portal (port 5170 equivalent) - served at /super-admin
    location /super-admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /super-admin/index.html;
    }

    location /super-admin {
        return 301 /super-admin/;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # WebSocket support for real-time features
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}